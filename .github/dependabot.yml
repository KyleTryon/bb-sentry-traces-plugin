version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The SDK is pinned to the version engines.bbPluginSdk names, the oldest
      # bb this plugin is built against. Raise both on purpose, not by a bot.
      - dependency-name: "@get-bb/plugin-sdk"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
