name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a new bb release that breaks the build shows up without a push.
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip
      - run: npm test
      - name: Check the version matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

  build:
    # What `bb plugin install` of a Git source does: production dependencies
    # only, then `bb plugin build`. Built with the oldest bb this plugin
    # supports (engines.bb), the latest release and the nightly.
    name: build (bb ${{ matrix.bb }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.bb == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        bb: ["0.50.0", latest, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Install bb ${{ matrix.bb }}
        run: npm install --global --ignore-scripts "bb-app@${{ matrix.bb }}"
      - name: Check the SDK pin matches the oldest supported bb
        if: matrix.bb == '0.50.0'
        run: bb plugin types --check .
      - run: bb plugin build .
      - name: Check the build output
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json");
            const meta = JSON.parse(fs.readFileSync("dist/server.meta.json", "utf8"));
            const missing = [...pkg.files, pkg.bb.server, pkg.bb.branding.icon].filter((f) => !fs.existsSync(f));
            if (missing.length) throw new Error("Missing: " + missing.join(", "));
            if (meta.pluginId !== "sentry-traces") throw new Error("Unexpected plugin id " + meta.pluginId);
            if (meta.pluginVersion !== pkg.version) throw new Error("Built version " + meta.pluginVersion + " is not " + pkg.version);
            console.log("Built", meta.pluginId, meta.pluginVersion, "with SDK", meta.sdkVersion);
          '
